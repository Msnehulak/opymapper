[project]
name = "opymapper"
version = "0.1.0b7"
authors = [
  { name="Msnehulak", email="pypi@snehulak.dev" },
]
description = "A Python tool to create osu! beatmaps programmatically."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.11"
dependencies = [

]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
"Homepage" = "https://github.com/Msnehulak/opymapper"

[tool.setuptools.packages.find]
where = ["."]
include = ["opymapper*"]
