name: Publish to PyPI

on:
  workflow_dispatch:  # Umožňuje ruční spuštění z tlačítka v GitHub Actions

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    # Práva potřebná pro moderní bezheslové OIDC přihlášení na PyPI (Trusted Publishers)
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: |
        python -m build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      # POKUD POUŽÍVÁŠ RUČNÍ API TOKEN (místo OIDC), odkomentuj následující řádky:
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
